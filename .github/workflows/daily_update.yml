name: Daily Data Update

# Reads NAV history from Neon (bootstrapping any fund Neon lacks from
# api.mfapi.in and adding AMFI's newest day), writes the new rows back to Neon,
# runs the calculation engine inside the runner, and publishes the JSON the
# dashboard reads into Neon's `files` table. The runner's SQLite database is
# thrown away; Neon is the only durable store.

# ONE RUN A DAY, ONE DEPLOY.
#
# There used to be a second cron at 08:15 IST as a catch-up. It committed too
# whenever more funds had reported overnight, so Netlify rebuilt twice a day for
# the same day's data. Now there is a single run and a single deploy; if it
# fails, re-run it from the Actions tab rather than waiting for a second cron.
#
# 23:45 IST is chosen because both upstreams are settled by then:
#   AMFI/mfapi publish the day's NAVs by ~23:00 IST  (verified: the 23:45 run
#     picked up as_of 2026-07-30 on 2026-07-30)
#   NSE closes 15:30 IST, so Yahoo's daily bar is 8h old  (verified: 2026-07-31
#     closes were available by 19:39 IST)
#
# Asking earlier risks storing an intraday index value as if it were a close.
on:
  schedule:
    # 23:45 IST = 18:15 UTC
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      max_staleness:
        description: 'Max age (days) of the newest NAV before the run aborts'
        required: false
        default: '6'
      skip_indices:
        description: 'Skip the Yahoo Finance index refresh'
        required: false
        default: 'false'

concurrency:
  group: daily-update
  cancel-in-progress: false

# Neon holds the NAV history, the published dashboard files and the 8 Market
# Pulse index files. One secret: the Neon connection string.
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The quartile rule is pinned in tests/test_quartile.py. Run it before
      # spending 10 minutes on a pipeline whose central calculation has drifted:
      # 10 of the 14 pinned bracket sizes change if the remainder goes back to
      # Q1, and every published quartile would move with it.
      - name: Check the quartile rule has not drifted
        run: python tests/test_quartile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify scheme catalogue is present
        run: |
          test -f data/scheme_catalogue.json \
            || { echo "::error::data/scheme_catalogue.json is missing — run scripts/export_catalogue.py and commit it"; exit 1; }
          python -c "import json;d=json.load(open('data/scheme_catalogue.json'));print(f\"catalogue: {d['scheme_count']} schemes\")"

      # Fail fast if Neon is unreachable, before the expensive part. Without it
      # every fund would look unstored and be bootstrapped from api.mfapi.in,
      # only for the run to fail at the publish step anyway.
      - name: Check the Neon connection
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          python scripts/neon_store.py --init --status
        env:
          PYTHONIOENCODING: utf-8

      # Pick up newly launched funds. api.mfapi.in has no category information,
      # so the universe comes from AMFI's own file, which carries the SEBI
      # category in its section headers.
      #
      # continue-on-error is deliberate: the refresh is a nice-to-have, and an
      # AMFI outage must not stop the NAV update. A failure here simply means
      # today's run uses yesterday's catalogue.
      #
      # The merge is additive — funds are only ever added or updated, never
      # dropped — and it aborts on its own if AMFI returns a suspiciously short
      # file, so a bad upstream day cannot shrink the universe.
      - name: Refresh scheme catalogue (new funds)
        continue-on-error: true
        run: python scripts/export_catalogue.py --refresh
        env:
          PYTHONIOENCODING: utf-8

      # Builds a temp DB, runs the engine, writes JSON, deletes the DB.
      # Aborts before touching any JSON if the upstream data is bad or stale.
      #
      # NAV history comes from Neon (--history-source neon, the default) and is
      # extended by AMFI's newest day; new rows are written back to Neon. mfapi is
      # touched only to bootstrap a fund Neon has never held — on the very first
      # run that is every fund (~3.5M rows, a few minutes). Pass
      # --history-source mfapi to re-download everything instead.
      - name: Run daily pipeline (Neon + mfapi + AMFI -> engine -> JSON)
        run: |
          python scripts/daily_run.py             --workers 12             --max-staleness "${{ github.event.inputs.max_staleness || '6' }}"             ${{ github.event.inputs.skip_indices == 'true' && '--skip-indices' || '' }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Confirm no database was left behind
        run: |
          if ls data/*.db >/dev/null 2>&1; then
            echo "::warning::a .db file was left in data/ — it will not be committed"
            ls -lh data/*.db
          else
            echo "No database stored. ✔"
          fi

      # Publish the dashboard files into Neon in one transaction, so the site
      # never sees half a build. --prune removes rows this build no longer
      # produces; it refuses if that would be more than 40% of what is stored.
      - name: Publish data to Neon
        run: python scripts/publish_data.py --prune
        env:
          PYTHONIOENCODING: utf-8

      # Only the catalogue is committed, and only when it changed -- without it a
      # newly launched fund would be rediscovered every day and never persist. It
      # is not read by the frontend, so netlify.toml's ignore rule stops this
      # commit from triggering a build.
      - name: Commit the scheme catalogue if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scheme_catalogue.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged - nothing committed, so nothing to deploy."
          else
            git commit -m "chore: scheme catalogue $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # site/public/data is untracked now, so anything showing up there in git
      # status means something wrote where it should not.
      - name: Confirm no data was committed
        if: always()
        run: |
          if git status --porcelain | grep -q "site/public/data"; then
            echo "::error::site/public/data is in git status - it must stay untracked"
            exit 1
          fi
          echo "Data lives in Neon only."

      # Same run, same closes: push the 8 Market Pulse indices to Neon so the
      # live path and the nightly build agree instead of drifting apart.
      #
      # Placed AFTER the commit on purpose. The NAV data is the expensive part of
      # this job and must never be held hostage to an index hiccup; by here it is
      # already stored. A failure below still turns the run red so it gets seen.
      - name: Publish Market Pulse indices to Neon
        run: python scripts/update_indices.py
        env:
          PYTHONIOENCODING: utf-8
