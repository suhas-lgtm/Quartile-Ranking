[build]
  base    = "site"
  publish = "dist"
  command = "npm run build"
  # Build only when something outside data/ changed.
  #
  # Netlify runs this before building: exit 0 means SKIP. The nightly job commits
  # data/scheme_catalogue.json when a new fund appears, and that file is only read
  # by the pipeline, never by the site — so rebuilding for it would spend minutes
  # producing an identical bundle.
  #
  # TWO BUGS WERE FIXED HERE, AND THE FIRST HAD DEADLOCKED DEPLOYS.
  #
  # 1. $CACHED_COMMIT_REF IS EMPTY WHENEVER THERE IS NO BUILD CACHE — a cleared
  #    cache, a relinked site, or a previous build that was cancelled. Unquoted
  #    and unguarded, the command then collapsed to
  #        git diff --quiet $COMMIT_REF -- ...
  #    which compares the WORKING TREE against that commit. Netlify's checkout is
  #    clean at exactly that commit, so there was no diff, exit 0, build
  #    cancelled. And a cancelled build writes no cache, so the variable stayed
  #    empty on the next push and it cancelled again — for ever. Once it started
  #    skipping it could never build again, which is precisely what happened:
  #    commits kept landing on main and the deployed bundle never moved.
  #    The `[ -n ... ] &&` guard makes an empty value mean BUILD, not skip.
  #
  # 2. THE PATHSPECS RESOLVED AGAINST base = "site". Netlify runs this from the
  #    base directory, so `.` meant site/ and `:(exclude)data/` meant
  #    site/data/ — a path that does not exist, so it excluded nothing. It gave
  #    the right answer for catalogue commits only by luck (data/ is not under
  #    site/), while making every change OUTSIDE site/ invisible: a scripts/ or
  #    netlify.toml commit looked like no change at all. `:(top)` and
  #    `:(exclude,top)` anchor the pathspecs to the repository root regardless of
  #    where the command runs.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- ':(top)' ':(exclude,top)data/' ':(exclude,top)site/public/data/'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Relative to base = "site".
  directory = "netlify/functions"

# ── /data/* and /live/indices/* are served from Neon ────────────────────────
#
# The data does not ship inside the site: the nightly pipeline writes it into
# Neon's `files` table, and netlify/functions/data.mts reads it back. Only code
# changes trigger a build; new data is live the moment the pipeline commits.
#
# Same-origin rewrites (status 200), so the browser needs no CORS and never sees
# a credential. The function needs DATABASE_URL set in the Netlify site's
# environment variables (Site configuration -> Environment variables).
#
# force = true makes these win over any same-named file left in dist/.
#
# ORDER MATTERS: Netlify evaluates redirects top-down, so both must stay above
# the SPA catch-all or /* would swallow them.

# The dashboard's data, organised by asset class:
#   meta.json  manifest.json  indices.json  watchlist_*.json  index/<id>.json
#   equity|hybrid|debt|other/<slug>/quartiles_*.json ...
[[redirects]]
  from   = "/data/*"
  to     = "/.netlify/functions/data/data/:splat"
  status = 200
  force  = true

# The 8 Market Pulse index files. Deliberately /live/indices/, never
# /data/index/: the latter is the 36 benchmark series the nightly build writes.
[[redirects]]
  from   = "/live/indices/*"
  to     = "/.netlify/functions/data/live/indices/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
